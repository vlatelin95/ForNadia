
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для Нади ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(
        ellipse at center,
        #18264b 0%,
        #090f25 55%,
        #030611 100%
    );
    font-family: Georgia, serif;
}

/* Звёздное небо */

#stars {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%, 100% {
        opacity: 0.2;
        transform: scale(0.7);
    }
    50% {
        opacity: 1;
        transform: scale(1.3);
    }
}

/* Центральная композиция */

.scene {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
    animation: appear 2s ease;
}

h1 {
    color: #f5dce9;
    font-size: 32px;
    font-weight: normal;
    letter-spacing: 3px;
    text-shadow: 0 0 20px #e6a8cf;
}

.subtitle {
    color: #a9b9db;
    font-size: 14px;
    letter-spacing: 2px;
    margin-top: -20px;
}

/* Конверт */

.envelope {
    position: relative;
    width: 290px;
    height: 190px;
    background: #d8bda2;
    border-radius: 5px;
    box-shadow:
        0 0 35px #d8a8c966,
        0 20px 60px #0009;
    animation: float 4s ease-in-out infinite;
    cursor: pointer;
    transition: transform 0.4s;
}

.envelope:hover {
    transform: scale(1.05);
}

.envelope::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    border-left: 145px solid transparent;
    border-right: 145px solid transparent;
    border-top: 110px solid #ead4bd;
    z-index: 3;
}

.envelope::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    border-left: 145px solid #c9a98c;
    border-right: 145px solid #c9a98c;
    border-top: 100px solid transparent;
    border-bottom: 90px solid #d7b99b;
    border-radius: 0 0 5px 5px;
    z-index: 2;
}

/* Сердце */

.heart {
    position: absolute;
    z-index: 5;
    top: 73px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 35px;
    filter: drop-shadow(0 0 10px #e88cae);
    animation: heartbeat 1.8s infinite;
}

@keyframes heartbeat {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.2); }
}

.hint {
    color: #d6c5e9;
    font-size: 14px;
    letter-spacing: 1px;
    animation: twinkle 3s infinite;
}

@keyframes float {
    0%, 100% { margin-top: 0; }
    50% { margin-top: -15px; }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 400px) {
    .envelope {
        transform: scale(0.9);
    }
    h1 {
        font-size: 27px;
    }
}
</style>
</head>

<body>

<div id="stars"></div>

<div class="scene">
    <h1>Для Нади ❤️</h1>
    <p class="subtitle">A little letter for you</p>

    <div class="envelope" onclick="openLetter()">
        <div class="heart">♥</div>
    </div>

    <p class="hint">Нажми на конверт ✨</p>
</div>

<script>
// Создание звёздного неба

const stars = document.getElementById("stars");

for (let i = 0; i < 130; i++) {
    const star = document.createElement("div");
    star.className = "star";

    const size = Math.random() * 3 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";
    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";
    star.style.animationDelay = Math.random() * 4 + "s";
    star.style.animationDuration =
        (Math.random() * 3 + 2) + "s";

    stars.appendChild(star);
}

function openLetter() {
    alert("Скоро здесь появится твоё письмо, Надя ❤️");
}
</script>

</body>
  </html>
